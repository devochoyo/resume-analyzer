<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Resume Analyzer{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="{{ url_for('main.index') }}" class="brand">
            <span class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14.5l2 2 4-4"/></svg>
            </span>
            <span>Resume Analyzer</span>
        </a>
        <nav class="nav-links">
            <a href="{{ url_for('main.index') }}" {% if request.endpoint == 'main.index' %}class="active"{% endif %}>Home</a>
            <a href="{{ url_for('main.admin_login') }}" {% if request.endpoint in ['main.admin_login', 'main.admin_dashboard'] %}class="active"{% endif %}>Admin</a>
        </nav>
    </div>
</header>

{% block content %}{% endblock %}

<footer class="page-footer">
    &copy; 2026 Resume Analyzer. All rights reserved.
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
